version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
        - test -n "$TEMPLEADDRESS_API_URL"
    build:
      commands:
        - env | grep '^TEMPLEADDRESS_API_URL=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
